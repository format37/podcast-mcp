<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>podcast console</title>
  <!--
    The console mark: the "//" that runs through the whole design system
    (masthead, "// REQUEST" headings, footer) meeting an upright level bar —
    dialogue becoming audio, which is what this server does.

    Three shapes, not five. The generated concept had a full three-bar
    waveform; rendered at the real 16 px tab size those bars collapse into an
    indistinguishable blob, so the waveform is reduced to a single upright bar
    that still reads as a level and keeps the mark legible. Strokes are 5 units
    (2.5 px at tab size) with 4-unit gaps for the same reason.

    No background — the tab strip supplies it. The media query makes the mark
    dark on light browser chrome and light on dark, instead of a fixed fill
    that vanishes in one of them.
  -->
  <style>
    path, rect { fill: #14141a; }
    @media (prefers-color-scheme: dark) {
      path, rect { fill: #f4f4f5; }
    }
  </style>
  <path d="M4 26 L9 6 h5 L9 26 Z"/>
  <path d="M13 26 L18 6 h5 L18 26 Z"/>
  <rect x="24" y="6" width="5" height="20"/>
</svg>
